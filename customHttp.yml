customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'

      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'

  - pattern: '/'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'

      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'

  - pattern: '/index.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'

      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'