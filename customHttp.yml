customHeaders:
  - pattern: '**'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'

      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'

      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://api.rennystrips.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' https://www.googletagmanager.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"

  - pattern: '/'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'

      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'

      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://api.rennystrips.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' https://www.googletagmanager.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"

  - pattern: '/index.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'

      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'

      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://api.rennystrips.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' https://www.googletagmanager.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"